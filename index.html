<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEMR 보건의료 통합 시스템</title>
  <style>
    body { 
      margin: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
      background: #ECEFF4; 
      color: #1D1D1F; 
      overflow-x: hidden; 
      -webkit-font-smoothing: antialiased;
    }
    
    /* 토스트 알림창 */
    #toast { 
      position: fixed; 
      bottom: 30px; 
      left: 50%; 
      transform: translateX(-50%); 
      background: linear-gradient(135deg, #007AFF, #0056B3); 
      box-shadow: 0 10px 30px rgba(0, 122, 255, 0.3);
      color: #fff; 
      padding: 14px 28px; 
      border-radius: 24px; 
      display: none; 
      z-index: 10000; 
      font-size: 14px; 
      font-weight: 600; 
    }
    #toast.show { display: block; animation: toastUp 0.3s ease; }
    @keyframes toastUp { from { transform: translate(-50%, 20px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
    
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #A0AAB5; border-radius: 10px; }
    
    .apple-card {
      background: #FFFFFF;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(24, 50, 80, 0.05);
      border: 1px solid rgba(47, 128, 237, 0.08);
      padding: 26px;
      box-sizing: border-box;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }
    
    /* 빠른 처방 버튼 */
    .rocket-btn { 
      transition: all 0.2s ease; 
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid transparent;
    }
    .rocket-btn:hover { 
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(0,0,0,0.08);
    }

    /* 환자 목록 아이템 */
    .patient-item { 
      padding: 14px 16px; 
      border-bottom: 1px solid #EBF1F6; 
      cursor: pointer; 
      transition: 0.2s ease; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
    }
    .patient-item:hover { background: #F4F7FA; border-radius: 10px; }
    .patient-item.active { 
      background: #E3F2FD; 
      border-left: 5px solid #007AFF; 
      font-weight: bold; 
      border-radius: 0 10px 10px 0;
    }

    /* 사이드 서랍 메뉴 */

    .drawer-overlay.show { display: block; }
