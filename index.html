<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

    body { margin: 0; font-family: 'Noto Sans KR', sans-serif; background: #f0f4f8; color: #1a202c; }

    #toast.show { display: block; }
    
    /* 병원 차트 스타일 스크롤바 */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #edf2f7; }
    ::-webkit-scrollbar-thumb { background: #cbd5e0; border-radius: 4px; }
    
    /* 로켓 처방 버튼 애니메이션 */
    .rocket-btn { transition: all 0.2s; border: 1px solid #e2e8f0; }
    .rocket-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 6px rgba(0,0,0,0.05); background: #ebf8ff !important; border-color: #bee3f8; }
  </style>
</head>
<body>

        <div style="text-align:left; margin-bottom:20px;">

          <input type="password" id="login-pwd" placeholder="••••••••" style="width:100%; padding:12px; border:1px solid #E2E8F0; border-radius:8px; box-sizing:border-box; font-size:15px;">
        </div>
        
        <button id="btn-login" style="width:100%; padding:14px; background:#3182CE; color:white; border:none; border-radius:8px; font-weight:700; font-size:16px; cursor:pointer; margin-bottom:15px; transition: 0.2s;">시스템 접속 (로그인)</button>
        
        <button id="btn-apple-login" style="width:100%; padding:12px; background:#000000; color:white; border:none; border-radius:8px; font-weight:600; font-size:14px; cursor:pointer; margin-bottom:20px; display:flex; align-items:center; justify-content:center; gap:8px;">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="white"><path d="M13.18 8.413c.027-2.311 1.897-3.1 1.913-3.11-.107-.157-1.684-2.39-4.015-2.553-1.928-.15-3.834 1.189-4.804 1.189-.983 0-2.557-1.127-4.167-1.097-2.113.033-4.066 1.242-5.15 3.136-2.22 3.864-.567 9.53 1.577 12.637 1.054 1.516 2.29 3.203 3.917 3.14 1.572-.064 2.164-1.012 3.963-1.012 1.79 0 2.338 1.012 3.978.98 1.67-.03 2.76-1.533 3.774-3.023 1.18-1.714 1.662-3.385 1.687-3.473-.036-.015-3.242-1.246-3.21-4.965zM10.74 2.108c.808-.987 1.353-2.355 1.204-3.718-1.165.048-2.58.784-3.418 1.772-.75.875-1.404 2.263-1.228 3.607 1.295.1 2.634-.674 3.442-1.66z"/></svg>
          Sign in with Apple
        </button>

        <p style="color:#718096; font-size:13px; margin:0;">아직 의료진 계정이 없으신가요? <a href="#" id="link-goto-signup" style="color:#3182CE; font-weight:700; text-decoration:none;">새 계정 등록</a></p>
      </div>

      <div id="signup-section" style="display: none;">
        <div style="text-align:left; margin-bottom:15px;">
          <label style="font-size:13px; color:#4A5568; font-weight:700; display:block; margin-bottom:6px;">새 이메일 주소</label>
          <input type="email" id="signup-email" placeholder="new-doctor@school.ac.kr" style="width:100%; padding:12px; border:1px solid #E2E8F0; border-radius:8px; box-sizing:border-box; font-size:15px;">
        </div>
        
        <div style="text-align:left; margin-bottom:20px;">
          <label style="font-size:13px; color:#4A5568; font-weight:700; display:block; margin-bottom:6px;">비밀번호 설정 (6자리 이상)</label>
          <input type="password" id="signup-pwd" placeholder="••••••••" style="width:100%; padding:12px; border:1px solid #E2E8F0; border-radius:8px; box-sizing:border-box; font-size:15px;">
        </div>
        
        <button id="btn-signup" style="width:100%; padding:14px; background:#48BB78; color:white; border:none; border-radius:8px; font-weight:700; font-size:16px; cursor:pointer; margin-bottom:20px; transition: 0.2s;">의료진 계정 생성하기</button>
        <p style="color:#718096; font-size:13px; margin:0;">이미 계정이 있으신가요? <a href="#" id="link-goto-login" style="color:#3182CE; font-weight:700; text-decoration:none;">로그인으로 돌아가기</a></p>
      </div>
      
      <p id="login-error" style="color:#E53E3E; font-size:13px; margin-top:15px; display:none; font-weight: 600;"></p>
    </div>
  </div>


  <div id="main-system" style="display: none; max-width: 1600px; margin: 0 auto; padding: 20px;">
    
    <div style="background: #1A365D; color: white; padding: 18px 24px; display: flex; justify-content: space-between; align-items: center; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); margin-bottom: 20px;">
      <h2 style="margin: 0; font-size: 22px; display: flex; align-items: center; gap: 10px;">🩺 SchoolCare 종합 전자의무기록(EMR) 시스템</h2>
      <div style="display:flex; align-items:center; gap:15px;">
        <span id="user-display-name" style="font-size:14px; background: rgba(255,255,255,0.1); padding:6px 12px; border-radius:20px;">의료진 접속 중</span>
        <button onclick="handleLogout()" style="background: #e53e3e; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s;">시스템 로그아웃</button>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1.6fr; gap: 20px; align-items: start;">
        
        <div style="display: flex; flex-direction: column; gap: 20px;">
            
            <div style="background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); border: 1px solid #e2e8f0;">
                <h3 style="margin-top: 0; color: #2b6cb0; margin-bottom: 20px; font-size: 18px; display: flex; align-items: center; gap: 8px; border-bottom: 2px solid #ebf8ff; padding-bottom: 10px;">📝 환자 접수 및 진료 기록</h3>
                
                <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px;">
                    <div>
                        <label style="display: block; font-size: 13px; font-weight: 700; color: #4a5568; margin-bottom: 6px;">학년</label>
                        <input type="number" id="reg-grade" placeholder="학년" style="width: 100%; padding: 10px; border: 1px solid #cbd5e0; border-radius: 6px; box-sizing: border-box; font-size: 14px;">
                    </div>
                    <div>
                        <label style="display: block; font-size: 13px; font-weight: 700; color: #4a5568; margin-bottom: 6px;">반</label>
                        <input type="number" id="reg-class" placeholder="반" style="width: 100%; padding: 10px; border: 1px solid #cbd5e0; border-radius: 6px; box-sizing: border-box; font-size: 14px;">
                    </div>
                    <div>
                        <label style="display: block; font-size: 13px; font-weight: 700; color: #4a5568; margin-bottom: 6px;">번호</label>
                        <input type="number" id="reg-number" placeholder="번호" style="width: 100%; padding: 10px; border: 1px solid #cbd5e0; border-radius: 6px; box-sizing: border-box; font-size: 14px;">
                    </div>
                    <div>
                        <label style="display: block; font-size: 13px; font-weight: 700; color: #4a5568; margin-bottom: 6px;">성명</label>
                        <input type="text" id="reg-name" placeholder="이름" style="width: 100%; padding: 10px; border: 1px solid #cbd5e0; border-radius: 6px; box-sizing: border-box; font-size: 14px;">
                    </div>
                </div>

                <div style="margin-bottom: 20px; background: #f7fafc; padding: 12px; border-radius: 8px; border: 1px dashed #cbd5e0;">
                  <label style="display: block; font-size: 12px; font-weight: 800; color: #2b6cb0; margin-bottom: 8px;">🚀 로켓 처방 세트 (클릭 시 자동 입력)</label>
                  <div style="display: flex; flex-wrap: wrap; gap: 6px;">
                    <button type="button" class="rocket-btn" onclick="applyRocketPreset('두통 및 오한', '타이레놀 1정 투약 후 침상 안정 수용')" style="background: white; border-radius: 6px; padding: 6px 10px; font-size: 12px; font-weight: 600; color:#4a5568; cursor:pointer;">💊 두통케어</button>
                    <button type="button" class="rocket-btn" onclick="applyRocketPreset('소화불량 및 복통', '백초시럽 10ml 급여 및 온찜질 조치')" style="background: white; border-radius: 6px; padding: 6px 10px; font-size: 12px; font-weight: 600; color:#4a5568; cursor:pointer;">🧪 소화불량</button>
                    <button type="button" class="rocket-btn" onclick="applyRocketPreset('찰과상 및 출혈', '생리식염수 세척 후 마데카솔 도포 및 멸균 밴드 부착')" style="background: white; border-radius: 6px; padding: 6px 10px; font-size: 12px; font-weight: 600; color:#4a5568; cursor:pointer;">🩹 찰과상처치</button>
                    <button type="button" class="rocket-btn" onclick="applyRocketPreset('발목 염좌 및 부종', '에어파스 도포 후 냉찜질 고정 조치 및 무리한 운동 금지 안내')" style="background: white; border-radius: 6px; padding: 6px 10px; font-size: 12px; font-weight: 600; color:#4a5568; cursor:pointer;">🧊 발목염좌</button>
                  </div>
                </div>
                
                <div style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px;">
                    <div>
                        <label style="display: block; font-size: 13px; font-weight: 700; color: #4a5568; margin-bottom: 6px;">주요 상병 증상 (CC)</label>
                        <input type="text" id="reg-symptoms" placeholder="예: 복통 및 두통, 가벼운 찰과상" style="width: 100%; padding: 10px; border: 1px solid #cbd5e0; border-radius: 6px; box-sizing: border-box; font-size: 14px;">
                    </div>
                    <div>
                        <label style="display: block; font-size: 13px; font-weight: 700; color: #4a5568; margin-bottom: 6px;">처방 및 조치 내역 (Rx/Tx)</label>
                        <input type="text" id="reg-treatment" placeholder="예: 소화제 복용 후 20분 침상 안정" style="width: 100%; padding: 10px; border: 1px solid #cbd5e0; border-radius: 6px; box-sizing: border-box; font-size: 14px;">
                    </div>
                </div>

                <div style="margin-bottom: 20px;">
                    <label style="display: block; font-size: 13px; font-weight: 700; color: #4a5568; margin-bottom: 6px;">📸 임상 사진 첨부 (선택사항)</label>
                    <input type="file" id="reg-photo" accept="image/*" style="width: 100%; padding: 6px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 13px; background: #fafafa;">
                </div>
                
                <button onclick="addStudent()" style="background: #2b6cb0; color: white; border: none; padding: 14px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; font-size: 16px; box-shadow: 0 4px 6px rgba(43, 108, 176, 0.2); transition: 0.2s;">💾 진료 차트 클라우드 등록</button>

        <div style="background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); border: 1px solid #e2e8f0;">
            <h3 style="margin-top: 0; color: #2c5282; margin-bottom: 18px; font-size: 18px; display: flex; align-items: center; gap: 8px; border-bottom: 2px solid #edf2f7; padding-bottom: 10px;">📋 실시간 환자별 의무기록 차트 리스트</h3>
            <div style="overflow-x: auto;">
                <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; min-width: 700px;">
                    <thead>
                        <tr style="background: #f7fafc; color: #4a5568; border-bottom: 2px solid #e2e8f0;">
                          <th style="padding: 12px; font-weight: 700; width: 90px;">차트 시각</th>
                          <th style="padding: 12px; font-weight: 700; width: 130px;">환자 인적사항</th>
                          <th style="padding: 12px; font-weight: 700; width: 80px;">성명</th>
                          <th style="padding: 12px; font-weight: 700;">주요 증상</th>
                          <th style="padding: 12px; font-weight: 700;">처방 및 조치 내용</th>
                          <th style="padding: 12px; font-weight: 700; text-align: center; width: 60px;">사진</th>
                          <th style="padding: 12px; font-weight: 700; text-align: center; width: 60px;">관리</th>
                        </tr>
                    </thead>
                    <tbody id="student-list">
                        </tbody>
                </table>
            </div>
        </div>
    </div>
  </div>

  <div id="image-modal" onclick="closeImageModal()" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:20000; justify-content:center; align-items:center;">
    <img id="modal-img" src="" style="max-width:90%; max-height:90%; border-radius:8px; box-shadow:0 10px 25px rgba(0,0,0,0.5);">
  </div>

  <div id="toast"></div>


  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged, OAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, doc, deleteDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js";

    // 장원이의 진짜 금고 열쇠 키 유지
    const firebaseConfig = {
      apiKey: "AIzaSyBYJYh5NteOmg2SfuydeFAcYy0lLjDn8iI",
      authDomain: "semr-d0dcb.firebaseapp.com",
      projectId: "semr-d0dcb",
      storageBucket: "semr-d0dcb.firebasestorage.app",
      messagingSenderId: "294566859435",
      appId: "1:294566859435:web:bb16da8b51bec94b335dee",
      measurementId: "G-SJY365QJ02"
    };

    // 초기화
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // DOM 연동 엘리먼트 정의
    const loginOverlay = document.getElementById('login-overlay');
    const loginSection = document.getElementById('login-section');
    const signupSection = document.getElementById('signup-section');
    
    const loginEmail = document.getElementById('login-email');
    const loginPwd = document.getElementById('login-pwd');
    const signupEmail = document.getElementById('signup-email');
    const signupPwd = document.getElementById('signup-pwd');
    
    const errorMsg = document.getElementById('login-error');
    const mainSystem = document.getElementById('main-system');
    const userDisplay = document.getElementById('user-display-name');

    // --- 화면 전환 토글 기능 ---
    document.getElementById('link-goto-signup').addEventListener('click', (e) => {
      e.preventDefault();
      loginSection.style.display = 'none';
      signupSection.style.display = 'block';
      errorMsg.style.display = 'none';
    });

    document.getElementById('link-goto-login').addEventListener('click', (e) => {
      e.preventDefault();
      signupSection.style.display = 'none';
      loginSection.style.display = 'block';
      errorMsg.style.display = 'none';
    });

    // --- [기능 4] 일반 이메일 회원가입 구현 ---
    document.getElementById('btn-signup').addEventListener('click', () => {
      const email = signupEmail.value.trim();
      const password = signupPwd.value.trim();
      errorMsg.style.display = 'none';

      if(!email || !password) {
        alert('이메일과 비밀번호를 모두 입력해주세요!');
        return;
      }

      createUserWithEmailAndPassword(auth, email, password)
        .then((userCredential) => {
          alert('🎉 의료진 계정이 정상 등록되었습니다! 시스템에 자동 로그인합니다.');
          signupSection.style.display = 'none';
          loginSection.style.display = 'block';
        })
        .catch((error) => {
          errorMsg.textContent = `⚠️ 가입 오류: ${error.message}`;
          errorMsg.style.display = 'block';
        });
    });

    // --- 로그인 처리 기능 ---
    document.getElementById('btn-login').addEventListener('click', () => {
      const email = loginEmail.value.trim();
      const password = loginPwd.value.trim();
      errorMsg.style.display = 'none';

      signInWithEmailAndPassword(auth, email, password)
        .catch((error) => {
          errorMsg.textContent = "⚠️ 로그인 실패: 정보를 다시 확인해 주세요.";
          errorMsg.style.display = 'block';
        });
    });

    // --- [기능 5] 애플 계정 로그인 연동 ---
    document.getElementById('btn-apple-login').addEventListener('click', () => {
      const provider = new OAuthProvider('apple.com');
      errorMsg.style.display = 'none';
      
      signInWithPopup(auth, provider)
        .then((result) => {
          showToast('🍏 애플 계정으로 안전하게 로그인되었습니다.');
        })
        .catch((error) => {
          errorMsg.textContent = "⚠️ 애플 로그인 실패: 파이어베이스 콘솔 연동 설정을 완료해야 정상 작동합니다.";
          errorMsg.style.display = 'block';
        });
    });

    // --- 인증 상태 변화 감시 루프 ---
    onAuthStateChanged(auth, (user) => {
      if (user) {
        loginOverlay.style.display = 'none';
        mainSystem.style.display = 'block';
        userDisplay.textContent = `🩺 ${user.email.split('@')[0]} 의료진 접속중`;
        showToast('🔑 메인 의무 시스템 실시간 보안 연동 완료.');
        syncDataWithFirestore();
      } else {
        loginOverlay.style.display = 'flex';
        mainSystem.style.display = 'none';
        loginEmail.value = '';
        loginPwd.value = '';
      }
    });

    // --- 로그아웃 처리 ---
    window.handleLogout = function() {
      signOut(auth).then(() => {
        showToast('🔒 안전하게 로그아웃 되어 시스템을 잠금 처리했습니다.');
      });
    };

    // --- [기능 2] 로켓 처방 주입 헬퍼 함수 ---
    window.applyRocketPreset = function(symptoms, treatment) {
      document.getElementById('reg-symptoms').value = symptoms;
      document.getElementById('reg-treatment').value = treatment;
      showToast('⚡ 로켓 처방 데이터가 세팅되었습니다.');
    };

    // --- [기능 3] 사진 파일 Base64 압축 변환 인코더 ---
    function encodeImageFile(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onloadend = function() {
          // 사진 크기 최소화 압축을 위해 Canvas 우회 처리
          const img = new Image();
          img.onload = function() {
            const canvas = document.createElement('canvas');
            const max_size = 400; // 최대 해상도 400px 제한으로 용량 대폭 다이어트
            let width = img.width;
            let height = img.height;
            if (width > height) { if (width > max_size) { height *= max_size / width; width = max_size; } }
            else { if (height > max_size) { width *= max_size / height; height = max_size; } }
            canvas.width = width; canvas.height = height;
            canvas.getContext('2d').drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', 0.7)); // 70% 압축률 자바스크립트 내장 처리
          }
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    // --- [기능 1] 신규 병원 차트 등록 프로세스 ---
    window.addStudent = async function() {
      const grade = document.getElementById('reg-grade').value.trim();
      const className = document.getElementById('reg-class').value.trim();
      const number = document.getElementById('reg-number').value.trim();
      const name = document.getElementById('reg-name').value.trim();
      const symptoms = document.getElementById('reg-symptoms').value.trim();
      const treatment = document.getElementById('reg-treatment').value.trim();
      const photoFile = document.getElementById('reg-photo').files[0];
      
      if(!grade || !className || !number || !name || !symptoms || !treatment) {
          alert('⚠️ 진료 차트 작성을 위해 필수 항목을 모두 입력해야 합니다.');
          return;
      }
      
      let photoBase64 = "";
      if(photoFile) {
        photoBase64 = await encodeImageFile(photoFile);
      }
      
      try {
          await addDoc(collection(db, "students"), {
              grade: grade,
              className: className,
              number: number,
              name: name,
              symptoms: symptoms,
              treatment: treatment,
              photo: photoBase64,
              timestamp: Date.now()
          });
          
          // 입력 폼 클리어
          document.getElementById('reg-grade').value = '';
          document.getElementById('reg-class').value = '';
          document.getElementById('reg-number').value = '';
          document.getElementById('reg-name').value = '';
          document.getElementById('reg-symptoms').value = '';
          document.getElementById('reg-treatment').value = '';
          document.getElementById('reg-photo').value = '';
          
          alert('💾 새로운 진료 차트가 파이어베이스 원격지에 안전하게 기록되었습니다.');
      } catch (error) {
          console.error("차트 등록 실패:", error);
          alert('클라우드 원격 전송에 실패했습니다.');
      }
    };

    // --- 구글 클라우드 DB와 내 웹사이트 실시간 동기화 시키기 ---
    function syncDataWithFirestore() {
      const q = query(collection(db, "students"));
      onSnapshot(q, (snapshot) => {
        const studentsData = [];
        snapshot.forEach((doc) => {
          studentsData.push({ dbId: doc.id, ...doc.data() });
        });
        window.renderStudents(studentsData);
      });
    }

    // --- [디자인 1] 병원 차트 스타일 화면 렌더링 엔진 ---
    window.renderStudents = function(studentsData) {
        const listBody = document.getElementById('student-list');
        if (!listBody) return;
        
        listBody.innerHTML = '';
        studentsData.sort((a, b) => b.timestamp - a.timestamp);
        
        if(studentsData.length === 0) {
            listBody.innerHTML = `<tr><td colspan="7" style="padding: 40px; text-align: center; color: #a0aec0; font-weight:600;">현재 대시보드에 접수 및 활성화된 진료 차트가 없습니다.</td></tr>`;
            return;
        }
        
        studentsData.forEach(student => {
            const tr = document.createElement('tr');
            tr.style.borderBottom = '1px solid #e2e8f0';
            tr.style.background = 'white';
            
            const date = student.timestamp ? new Date(student.timestamp) : new Date();
            const timeStr = `${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2, '0')}`;
            
            // 사진 유무 처리 아이콘 생성
            let photoHtml = `<span style="color:#cbd5e0;">-</span>`;
            if(student.photo) {
              photoHtml = `<img src="${student.photo}" onclick="openImageModal('${student.photo}')" style="width:36px; height:36px; object-fit:cover; border-radius:4px; cursor:pointer; border:1px solid #cbd5e0; display:block; margin:0 auto;">`;
            }
            
            tr.innerHTML = `
                <td style="padding: 14px 12px; color: #4a5568; font-weight:700; font-family:monospace;">${timeStr}</td>
                <td style="padding: 14px 12px; color: #4a5568;"><span style="background:#edf2f7; padding:3px 6px; border-radius:4px; font-size:12px; font-weight:bold;">${student.grade}-${student.className}-${student.number}</span></td>
                <td style="padding: 14px 12px; font-weight: 700; color: #2d3748;">${student.name}</td>
                <td style="padding: 14px 12px; color: #e53e3e; font-weight: 700;"><span style="border-left: 3px solid #e53e3e; padding-left: 6px;">${student.symptoms}</span></td>
                <td style="padding: 14px 12px; color: #2b6cb0; font-weight: 500;">${student.treatment}</td>
                <td style="padding: 14px 12px; text-align: center;">${photoHtml}</td>
                <td style="padding: 14px 12px; text-align: center;">
                    <button onclick="deleteStudent('${student.dbId}')" style="background: #fff5f5; color: #e53e3e; border: 1px solid #fed7d7; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 700; transition:0.2s;">폐기</button>
                </td>
            `;
            listBody.appendChild(tr);
        });
    };

    // --- 영구 격리 폐기 조치 ---
    window.deleteStudent = async function(id) {
        if(confirm('🚨 영구 폐기된 의무기록 차트는 절대 복구할 수 없습니다. 정말 소멸 처리합니까?')) {
            try {
                await deleteDoc(doc(db, "students", id));
                showToast('🗑️ 지정된 진료 차트 파쇄 완료.');
            } catch (error) {
                alert('차트 삭제 실패.');
            }
        }
    };

    // --- 이미지 모달 제어 ---
    window.openImageModal = function(src) {
      document.getElementById('modal-img').src = src;
      document.getElementById('image-modal').style.display = 'flex';
    };
    window.closeImageModal = function() {
      document.getElementById('image-modal').style.display = 'none';
    };

    // --- 토스트 알림 제어 ---
    window.showToast = function(msg){
      const t = document.getElementById('toast');
      if(t) {
        t.textContent = msg; t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 3000);
      }
    };
  </script>
</body>
</html>
